<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Cerrada - Habitat+</title>
    <!-- Referencia a Bootstrap CSS (Azul Clásico) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <style>
        .logout-card {
            max-width: 480px;
            border: none;
            border-radius: 16px;
        }

        .logout-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.5rem auto;
        }
    </style>
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card logout-card shadow-lg text-center p-4 p-md-5 bg-white">
                    <div class="card-body p-0">

                        <!-- Icono de Candado / Sesión Cerrada -->
                        <div class="logout-icon bg-primary bg-opacity-10 text-primary">
                            🔒
                        </div>

                        <!-- Título y Mensaje -->
                        <h1 class="h3 fw-bold text-dark mb-2">¡Sesión de Vecino Cerrada!</h1>
                        <p class="text-muted mb-4">
                            Has salido de tu cuenta de vecino de <strong>HABITAT+</strong> de forma segura. ¡Gracias por usar la plataforma!
                        </p>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-3">
                            <a href="../index.html" class="btn btn-primary btn-lg fw-semibold py-3">
                                🏠 Volver al Inicio (index.html)
                            </a>
                            <a href="login.html" class="btn btn-outline-secondary fw-semibold py-2">
                                🔑 Iniciar Sesión Nuevamente
                            </a>
                        </div>

                    </div>
                    <div class="card-footer bg-transparent border-0 pt-4 text-muted small">
                        HABITAT+ &copy; 2026 - Portal del Vecino
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
