</head>

<body class="bg-light">

    <!-- Navbar Admin en Azul Clásico de Bootstrap -->

        <nav class="navbar navbar-expand-lg navbar-dark bg-verde shadow-sm" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4" href="panel.html">HABITAT+ <span class="badge bg-light text-primary fs-6 align-middle ms-2">ADMIN</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="panel.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="reclamos.html">Reclamos</a></li>
                        <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                        <li class="nav-item"><a class="nav-link active" href="vecinos.html">Vecinos</a></li>
                        <li class="nav-item"><a class="nav-link" href="metricas.html">Métricas</a></li>
                        <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                        <li class="nav-item dropdown ms-lg-2">
                            <a class="nav-link dropdown-toggle text-white" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                👤 Admin
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="adminDropdown">
                                <li><a class="dropdown-item text-danger" href="cerrar_sesion.html">🚪 Cerrar Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h1 class="h4 text-primary fw-bold mb-1">Registrar Nuevo Vecino</h1>
                        <p class="text-muted small mb-0">Completá los datos requeridos para dar de alta una nueva cuenta de residente.</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Formulario de Registro de Vecino con redirección a confirmacion_nuevo_vecino.html -->
                        <form action="confirmacion_nuevo_vecino.html" method="GET">
                            
                            <div class="row g-3">
                                
                                <!-- 1. Nombre y Apellido -->
                                <div class="col-12 col-md-6">
                                    <label for="nombre" class="form-label fw-semibold">Nombre y Apellido <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="ej. Juan Pérez" required>
                                </div>

                                <!-- 2. Documento -->
                                <div class="col-12 col-md-6">
                                    <label for="documento" class="form-label fw-semibold">Documento (DNI / CI) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="documento" name="documento" placeholder="ej. 38.450.123" required>
                                </div>

                                <!-- 3. Correo Electrónico -->
                                <div class="col-12 col-md-6">
                                    <label for="correo" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="ej. juan.perez@email.com" required>
                                </div>

                                <!-- 4. Teléfono -->
                                <div class="col-12 col-md-6">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono de Contacto <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="ej. +54 11 4589-2310" required>
                                </div>

                                <!-- 5. Número de Vivienda -->
                                <div class="col-12">
                                    <label for="vivienda" class="form-label fw-semibold">Número de Vivienda / Unidad <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="vivienda" name="vivienda" placeholder="ej. Piso 4 - Depto B" required>
                                </div>

                                <!-- 6. Contraseña -->
                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>

                                <!-- 7. Confirmación de Contraseña -->
                                <div class="col-12 col-md-6">
                                    <label for="confirm_password" class="form-label fw-semibold">Confirmar Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                                </div>

                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                                <a href="vecinos.html" class="btn btn-outline-secondary px-4 py-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary fw-semibold px-4 py-2">Registrar</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
