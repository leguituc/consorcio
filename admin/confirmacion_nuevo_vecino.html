<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vecino Registrado Con Éxito - Habitat+</title>
    <!-- Referencia a Bootstrap CSS (Azul Clásico) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .confirm-card {
            max-width: 520px;
            border: none;
            border-radius: 16px;
        }
        .success-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem auto;
        }
    </style>
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                
                <div class="card confirm-card shadow-lg text-center p-4 p-md-5 bg-white">
                    <div class="card-body p-0">
                        
                        <!-- Icono de Éxito -->
                        <div class="success-icon bg-success bg-opacity-10 text-success">
                            ✓
                        </div>

                        <!-- Título y Mensaje de Confirmación -->
                        <h1 class="h3 fw-bold text-dark mb-2">¡Vecino Registrado con Éxito!</h1>
                        <p class="text-muted mb-4">
                            El nuevo residente ha sido dado de alta correctamente en la plataforma <strong>HABITAT+</strong>. Se ha enviado una notificación con las credenciales de acceso.
                        </p>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-3">
                            <a href="vecinos.html" class="btn btn-primary btn-lg fw-semibold py-3">
                                👥 Volver a Gestión de Vecinos
                            </a>
                            <a href="nuevo_vecino.html" class="btn btn-outline-secondary fw-semibold py-2">
                                + Registrar Otro Vecino
                            </a>
                        </div>

                    </div>
                    <div class="card-footer bg-transparent border-0 pt-4 text-muted small">
                        HABITAT+ &copy; 2026 - Panel de Administración
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
